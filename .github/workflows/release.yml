name: Release

on:
  workflow_dispatch:
    inputs:
      use_existing_notes:
        description: 'Keep the AI-generated notes from the draft release'
        required: false
        type: boolean
        default: true
      release_notes:
        description: 'Release notes (ignored if use_existing_notes is true)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for gh CLI context)
        uses: actions/checkout@v5

      - name: Find latest draft release
        id: draft
        run: |
          DRAFT=$(gh release list --json tagName,isDraft \
            -q '[.[] | select(.isDraft)] | .[0].tagName')
          if [ -z "$DRAFT" ] || [ "$DRAFT" = "null" ]; then
            echo "::error::No draft release found! Push to feature/experimental first to create a release candidate."
            exit 1
          fi
          echo "tag=$DRAFT" >> $GITHUB_OUTPUT
          echo "Found draft release: $DRAFT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get draft release info
        id: info
        run: |
          SHA=$(gh release view ${{ steps.draft.outputs.tag }} \
            --json targetCommitish -q '.targetCommitish')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Commit: $SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Experimental Build passed
        run: |
          echo "Checking latest Experimental Build status on feature/experimental..."

          STATUS=$(gh run list \
            --branch feature/experimental \
            --workflow ".github/workflows/dev-build.yml" \
            --json conclusion \
            --limit 1 \
            -q '.[0].conclusion')

          HEAD_SHA=$(gh run list \
            --branch feature/experimental \
            --workflow ".github/workflows/dev-build.yml" \
            --json headSha \
            --limit 1 \
            -q '.[0].headSha')

          TARGET="${{ steps.info.outputs.sha }}"

          echo "Experimental Build conclusion: $STATUS"
          echo "Latest Experimental Build SHA: $HEAD_SHA"
          echo "Draft target: $TARGET"

          if [ -z "$STATUS" ] || [ "$STATUS" = "null" ]; then
            echo "::error::No Experimental Build run found for feature/experimental"
            exit 1
          fi

          if [ "$STATUS" != "success" ]; then
            echo "::error::Experimental Build did not pass on feature/experimental"
            echo "Status was: $STATUS"
            echo ""
            echo "The release candidate cannot be published until Experimental Build (including E2E tests) passes."
            exit 1
          fi

          if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "null" ] && [ "$TARGET" != "$HEAD_SHA" ]; then
            echo "::error::Draft release does not match the latest successful Experimental Build commit"
            echo "Draft target: $TARGET"
            echo "Latest successful build: $HEAD_SHA"
            exit 1
          fi

          echo "Experimental Build passed and matches the draft release commit."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release body
        env:
          USE_EXISTING: ${{ inputs.use_existing_notes }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG: ${{ steps.draft.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the release notes content
          if [ "$USE_EXISTING" = "true" ]; then
            echo "Using existing notes from draft release..."
            # Fetch existing draft body and extract content before the --- separator
            EXISTING=$(gh release view "$TAG" --json body -q '.body')
            # Extract everything up to the --- line (the AI notes section)
            NOTES_CONTENT=$(echo "$EXISTING" | sed '/^---$/,$d' | sed '/^[[:space:]]*$/d')
            if [ -n "$NOTES_CONTENT" ]; then
              echo "Found existing notes"
            else
              echo "No existing notes found, will use minimal body"
            fi
          else
            echo "Using provided release notes..."
            if [ -n "$RELEASE_NOTES" ]; then
              NOTES_CONTENT="## What's Changed

          $RELEASE_NOTES"
            else
              NOTES_CONTENT=""
            fi
          fi

          # Build final body with install instructions
          {
            if [ -n "$NOTES_CONTENT" ]; then
              echo "$NOTES_CONTENT"
              echo ""
              echo "---"
              echo ""
            fi
            echo "### Update"
            echo ""
            echo "Already have this experimental fork installed? Just run:"
            echo '```bash'
            echo "tally update"
            echo '```'
            echo ""
            echo "### Install"
            echo ""
            echo "Download the zip for your platform from this release."
            echo ""
            echo "Repository: https://github.com/${{ github.repository }}"
          } > body.md

          echo "Release body:"
          cat body.md

      - name: Publish release
        run: |
          gh release edit ${{ steps.draft.outputs.tag }} \
            --title "Tally Experimental ${{ steps.draft.outputs.tag }}" \
            --notes-file body.md \
            --draft=false \
            --latest
          echo ""
          echo "Published ${{ steps.draft.outputs.tag }} as latest release!"
          echo "View at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.draft.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}

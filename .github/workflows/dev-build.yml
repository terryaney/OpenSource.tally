name: Experimental Build

on:
  push:
    branches: [feature/experimental]

jobs:
  # Run tests first - gate the build
  tests:
    uses: ./.github/workflows/test.yml

  prepare:
    needs: [tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=0.1.$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

  # Build dev version
  build-dev:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}-dev
      git_sha: ${{ github.sha }}
      ref: refs/heads/feature/experimental

  # Build release version (same commit, stable version number)
  build-release:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      git_sha: ${{ github.sha }}
      ref: refs/heads/feature/experimental

  # Generate release notes with AI (optional - only if auth is configured)
  generate-notes:
    needs: [prepare, build-release]
    uses: ./.github/workflows/generate-release-notes.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  release:
    needs: [prepare, build-dev, build-release, generate-notes]
    if: ${{ always() && needs.build-dev.result == 'success' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Download dev artifacts
      - name: Download dev artifacts
        uses: actions/download-artifact@v4
        with:
          path: dev-artifacts
          pattern: tally-*-experimental-dev
          merge-multiple: false

      # Download RC artifacts
      - name: Download RC artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: tally-*-experimental-release
          merge-multiple: false

      - name: List artifacts
        run: |
          echo "Dev artifacts:"
          find dev-artifacts -type f
          echo ""
          echo "Release artifacts:"
          find release-artifacts -type f

      # Delete old dev release and create new one
      - name: Create dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete dev --cleanup-tag --yes || true

          cat > notes.md << EOF
          Latest prerelease build from feature/experimental

          **Version:** ${VERSION}-dev
          **Commit:** ${SHA}

          ### Update

          \`\`\`bash
          tally update --prerelease
          \`\`\`

          Download the zip for your platform from this prerelease if you need a fresh install.
          EOF

          gh release create dev \
            --target "${SHA}" \
            --title "Experimental Build (${VERSION}-dev)" \
            --notes-file notes.md \
            --prerelease \
            dev-artifacts/*/*.zip

      # Delete old draft releases and create new one
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
          AI_NOTES: ${{ needs.generate-notes.outputs.notes }}
        run: |
          # Delete any existing drafts
          for tag in $(gh release list --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName'); do
            echo "Deleting draft release: $tag"
            gh release delete "$tag" --yes || true
          done

          # Use AI-generated notes if available, otherwise use default
          if [ -n "$AI_NOTES" ]; then
            echo "Using AI-generated release notes"
            cat > notes.md << EOF
          ## What's Changed

          ${AI_NOTES}

          ---

          **Commit:** ${SHA}
          **Branch:** feature/experimental
          **Validation:** Pending publish
          EOF
          else
            echo "No AI notes available, using default"
            cat > notes.md << EOF
          Experimental release candidate - pending publish

          **Commit:** ${SHA}
          **Branch:** feature/experimental
          **Validation:** Pending publish
          EOF
          fi

          # Create new draft
          gh release create "v${VERSION}" \
            --target "${SHA}" \
            --title "Tally Experimental v${VERSION}" \
            --notes-file notes.md \
            --draft \
            release-artifacts/*/*.zip

  # Run E2E smoke tests after release (tests the published dev build)
  e2e-tests:
    needs: [release]
    uses: ./.github/workflows/e2e-test.yml
